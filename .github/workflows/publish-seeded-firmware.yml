name: Publish tested firmware binaries

on:
  push:
    branches: [main]
    paths:
      - '.firmware-seed/**'
      - '.github/workflows/publish-seeded-firmware.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified firmware package
        run: |
          mkdir -p firmware/latest
          cat .firmware-seed/factory-install.bin.gz.part-* | gzip -dc > firmware/latest/factory-install.bin
          dd if=firmware/latest/factory-install.bin of=firmware/latest/bootloader.bin bs=1 count=21168 status=none
          dd if=firmware/latest/factory-install.bin of=firmware/latest/partition-table.bin bs=1 skip=32768 count=3072 status=none
          dd if=firmware/latest/factory-install.bin of=firmware/latest/ota_data_initial.bin bs=1 skip=57344 count=8192 status=none
          dd if=firmware/latest/factory-install.bin of=firmware/latest/sms_forwarding_idf.bin bs=1 skip=65536 count=1207312 status=none
          (cd firmware/latest && sha256sum -c SHA256SUMS)
      - name: Commit firmware files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -r .firmware-seed
          git add firmware/latest/*.bin
          git commit -m "release: add verified ESP32-C3 firmware binaries"
          git push
